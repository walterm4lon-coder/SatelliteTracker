<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Satellite Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="globeViz"></div>

    <button id="legendTab">LEGEND</button>

    <a id="predictBtn" href="predict.html">Predict Passes</a>

    <div id="legendPanel">
        <h2>Legend</h2>
        <div class="legendItem"><span class="legendDot" style="background: yellow;"></span> Space Stations</div>
        <div class="legendItem"><span class="legendDot" style="background: blue;"></span> Visual (brightest)</div>
        <div class="legendItem"><span class="legendDot" style="background: red;"></span> GPS</div>
        <div class="legendItem"><span class="legendDot" style="background: green;"></span> Starlink (might not show sometimes)</div>
        <div class="legendItem"><span class="legendDot" style="background: orange;"></span> Weather</div>
    </div>

    <div id="infoPanel">
        <h2 id="infoName">-</h2>
        <p>Altitude: <span id="infoAlt">-</span> km</p>
        <p>Speed: <span id="infoSpeed">-</span> km/h</p>
    </div>
    <div id="loadingScreen">
        <div id="loadingHeader">SATELLITE TRACKER // WAIT UP TO 30 SECONDS</div>
        <div id="loadingTerminal"></div>
        <div id="loadingStatus">INITIALIZING...</div>
    </div>

    <script src="loader.js"></script>
    <script src="//unpkg.com/globe.gl"></script>
    <script type="module" src="script.js"></script>

</body>
</html>
